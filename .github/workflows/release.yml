name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_tag=$(gh release list --limit 100 --json tagName,name,isDraft,isPrerelease --jq '.[] | select(.name == "Initial release" and (.isDraft | not) and (.isPrerelease | not)) | .tagName' | head -n 1)
          if [ -n "$existing_tag" ] && [ "$existing_tag" != "$GITHUB_REF_NAME" ]; then
            gh release edit "$existing_tag" --tag "$GITHUB_REF_NAME" --title "Initial release" --notes-file RELEASE_NOTES.md --verify-tag
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Initial release" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Initial release" --notes-file RELEASE_NOTES.md
          fi
